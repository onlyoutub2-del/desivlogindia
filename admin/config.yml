backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: editorial_workflow

site_url: https://desivlogindia.netlify.app

collections:
  - name: "vlogs"
    label: "Vlogs"
    folder: "content/vlogs"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Vlog Title"
        name: "title"
        widget: "string"

      - label: "Date"
        name: "date"
        widget: "datetime"

      - label: "Thumbnail"
        name: "thumbnail"
        widget: "image"
        required: false

      - label: "YouTube Video"
        name: "youtube"
        widget: "string"
        required: false

      - label: "Location"
        name: "location"
        widget: "string"
        required: false

      - label: "Description"
        name: "body"
        widget: "markdown"
