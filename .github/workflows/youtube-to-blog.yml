name: YouTube to Blog Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  publish-blogs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install YouTube tool
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Create blogs for all long videos
        run: |
          python <<'PY'
          import subprocess, html, re
          from pathlib import Path

          channel_url = "https://www.youtube.com/@YogeshSaharan1/videos"
          cmd = ["yt-dlp", "--flat-playlist", "--playlist-end", "1000", "--print", "%(id)s\\t%(duration)s\\t%(title)s", channel_url]
          raw = subprocess.check_output(cmd, text=True, stderr=subprocess.STDOUT).strip().splitlines()
          rows = [x for x in raw if "\\t" in x]

          published = set()
          p = Path("published-videos.txt")
          if p.exists():
              published = set(x.strip() for x in p.read_text(encoding="utf-8").splitlines() if x.strip())

          out = Path("blogs")
          out.mkdir(exist_ok=True)
          index = Path("index.html")
          content = index.read_text(encoding="utf-8")
          marker = "<!-- AUTOMATED_BLOGS -->"
          cards = []

          for row in rows:
              video_id, duration, title = row.split("\\t", 2)
              try:
                  seconds = float(duration)
              except Exception:
                  continue
              if seconds < 180 or video_id in published:
                  continue

              safe_title = html.escape(title.strip())
              slug = re.sub(r"[^a-z0-9]+", "-", title.lower()).strip("-")[:70] or video_id
              video_url = f"https://www.youtube.com/watch?v={video_id}"
              excerpt = f"{title.strip()} — Desi Vlog India ka vlog. Original video dekhiye aur is vlog ke topic ko explore kijiye."
              page = f'''<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{safe_title} | Desi Vlog India</title><meta name="description" content="{html.escape(excerpt)}"><link rel="canonical" href="https://onlyoutub2-del.github.io/desivlogindia/blogs/{slug}.html"><style>body{{font-family:system-ui,Arial;max-width:850px;margin:auto;padding:24px;line-height:1.7;background:#0b0d10;color:#f5f7fa}}a{{color:#ff9b43}}.video{{aspect-ratio:16/9}}iframe{{width:100%;height:100%;border:0;border-radius:12px}}.meta{{color:#a9b0ba}}</style></head><body><p><a href="../">← Desi Vlog India</a></p><p class="meta">Desi Vlog India Blog</p><h1>{safe_title}</h1><p>{html.escape(excerpt)}</p><h2>Vlog ke baare mein</h2><p>Ye blog original YouTube vlog tak easy access deta hai. Video ke actual visuals, places, events aur experiences ko samajhne ke liye original vlog dekhein.</p><h2>Kya dekhne ko milega?</h2><ul><li>Original long-form vlog ka complete experience.</li><li>Video ke topic se judi real visuals aur experiences.</li><li>Desi Vlog India ka original content.</li></ul><h2>Watch the Original Vlog</h2><div class="video"><iframe src="https://www.youtube.com/embed/{video_id}" title="{safe_title}" allowfullscreen></iframe></div><p><a href="{video_url}" target="_blank" rel="noopener">Watch on YouTube →</a></p></body></html>'''
              (out / f"{slug}.html").write_text(page, encoding="utf-8")
              published.add(video_id)
              cards.append(f'''<article class="card automated-blog"><div class="thumb">📝</div><div class="card-body"><span class="tag">BLOG</span><h3>{safe_title}</h3><p>{html.escape(excerpt)}</p><a class="btn primary" href="blogs/{slug}.html">Read Full Blog →</a></div></article>''')

          if cards:
              block = "".join(cards)
              if marker in content:
                  content = content.replace(marker, marker + block, 1)
              else:
                  section = f'''<section id="blogs"><div class="container"><div class="section-head"><div><h2>Latest Blogs</h2><p>Blogs generated from Desi Vlog India long videos.</p></div></div><div class="grid">{marker}{block}</div></div></section>'''
                  content = content.replace("</main>", section + "</main>", 1) if "</main>" in content else content + section
              index.write_text(content, encoding="utf-8")
              p.write_text("\\n".join(sorted(published)) + "\\n", encoding="utf-8")
              print(f"Created {len(cards)} new blog(s).")
          else:
              print("No new long videos found.")
          PY

      - name: Publish to main
        run: |
          git config user.name "desivlogindia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blogs index.html published-videos.txt
          git diff --cached --quiet || git commit -m "Publish blogs from YouTube long videos"
          git push origin main