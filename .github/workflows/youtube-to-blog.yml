name: YouTube to Blog Draft

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  create-blog-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install YouTube tool
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Create free blog draft from latest YouTube vlog
        run: |
          python <<'PY'
          import html, re, subprocess
          from pathlib import Path

          channel_url = "https://www.youtube.com/@YogeshSaharan1/videos"
          raw = subprocess.check_output([
              "yt-dlp", "--flat-playlist", "--playlist-end", "1",
              "--print", "%(id)s\\t%(title)s", channel_url
          ], text=True, stderr=subprocess.STDOUT).strip().splitlines()
          rows = [x for x in raw if "\\t" in x]
          if not rows:
              raise SystemExit("Could not detect a YouTube video from the channel.")

          video_id, title = rows[-1].split("\\t", 1)
          title = title.strip()
          video_url = f"https://www.youtube.com/watch?v={video_id}"
          safe_title = html.escape(title)
          slug = re.sub(r"[^a-z0-9]+", "-", title.lower()).strip("-")[:70] or video_id

          excerpt = f"{safe_title} — Desi Vlog India par Yogesh Saharan ka latest vlog. Video dekhiye aur is vlog ke highlights aur experience ko YouTube par explore kijiye."
          body = f'''<p><strong>{safe_title}</strong> Desi Vlog India par Yogesh Saharan ka latest vlog hai. Is post mein aapko is video ka quick introduction aur original vlog dekhne ka direct option milega.</p>
          <h2>Is vlog ke baare mein</h2>
          <p>Is article ka focus original YouTube vlog ko readers tak aasani se pahunchana hai. Video ke title se aap topic ka basic idea le sakte hain aur poora experience original video mein dekh sakte hain.</p>
          <h2>Vlog kyun dekhein?</h2>
          <ul><li>Original video directly YouTube par dekhein.</li><li>Desi Vlog India ke naye vlogs aur daily experiences follow karein.</li><li>Video pasand aaye to channel subscribe karke naye videos ke updates paayein.</li></ul>
          <h2>Watch the Latest Vlog</h2>'''

          page = f'''<!doctype html>
          <html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>{safe_title} | Desi Vlog India</title>
          <meta name="description" content="{html.escape(excerpt)}">
          <link rel="canonical" href="https://desivlogindia.netlify.app/blogs/{slug}.html">
          <style>body{{font-family:system-ui,Arial;max-width:850px;margin:auto;padding:24px;line-height:1.7;background:#0b0d10;color:#f5f7fa}}a{{color:#ff9b43}}.video{{aspect-ratio:16/9}}iframe{{width:100%;height:100%;border:0;border-radius:12px}}.meta{{color:#a9b0ba}}</style></head>
          <body><p><a href="../">← Desi Vlog India</a></p><p class="meta">Latest Vlog</p><h1>{safe_title}</h1><p>{html.escape(excerpt)}</p>{body}<div class="video"><iframe src="https://www.youtube.com/embed/{video_id}" title="{safe_title}" allowfullscreen></iframe></div><p><a href="{video_url}" target="_blank" rel="noopener">Watch on YouTube →</a></p></body></html>'''

          out = Path("blogs")
          out.mkdir(exist_ok=True)
          (out / f"{slug}.html").write_text(page, encoding="utf-8")
          Path("blog-latest.txt").write_text(f"{slug}\n{title}\n{video_url}\n", encoding="utf-8")
          print(f"Created blog draft: blogs/{slug}.html")
          PY

      - name: Create draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="blog-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git config user.name "desivlogindia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blogs blog-latest.txt
          git commit -m "Create blog draft from latest YouTube vlog"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "New blog draft from latest YouTube vlog" --body "Free automated blog draft generated from the latest YouTube video. Review before merging."