name: Sync Blogs to Homepage

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build latest blog section
        run: |
          python <<'PY'
          from pathlib import Path
          import re, html

          index = Path("index.html")
          content = index.read_text(encoding="utf-8")

          blogs = []
          for path in Path("blogs").glob("*.html"):
              text = path.read_text(encoding="utf-8", errors="ignore")
              m = re.search(r"<h1>(.*?)</h1>", text, re.S | re.I)
              title = re.sub(r"<[^>]+>", "", m.group(1)).strip() if m else path.stem.replace("-", " ").title()
              title = html.unescape(title)
              blogs.append((path.stat().st_mtime, path.name, title))

          blogs.sort(reverse=True)
          blogs = blogs[:6]

          cards = []
          for _, filename, title in blogs:
              cards.append(f'''<article class="card automated-blog"><div class="thumb">📝</div><div class="card-body"><span class="tag">BLOG</span><h3>{html.escape(title)}</h3><p>Desi Vlog India ka latest blog. Original vlog aur full story dekhein.</p><a class="btn primary" href="blogs/{html.escape(filename)}">Read Full Blog →</a></div></article>''')

          section = '<!-- AUTO_BLOGS_START --><section id="blogs"><div class="container"><div class="section-head"><div><h2>Latest Blogs</h2><p>Fresh posts from Desi Vlog India.</p></div></div><div class="grid">' + ''.join(cards) + '</div></div></section><!-- AUTO_BLOGS_END -->'

          content = re.sub(r'<!-- AUTO_BLOGS_START -->.*?<!-- AUTO_BLOGS_END -->', '', content, flags=re.S)
          content = content.replace('</main>', section + '\n</main>', 1)
          index.write_text(content, encoding="utf-8")
          print(f"Synced {len(blogs)} blogs to homepage")
          PY

      - name: Commit homepage
        run: |
          git config user.name "desivlogindia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "Homepage already up to date." && exit 0
          git commit -m "Sync latest blogs to homepage"
          git push origin main
