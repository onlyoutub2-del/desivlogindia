<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>All Blogs | Desi Vlog India</title>
<meta name="description" content="Desi Vlog India ke saare latest blogs, vlogs aur video stories ek jagah.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://onlyoutub2-del.github.io/desivlogindia/blogs.html">
<style>
:root{--bg:#0b0d10;--card:#14171c;--text:#f5f7fa;--muted:#a9b0ba;--accent:#ff5b35;--line:#252a32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;line-height:1.6}.wrap{width:min(1100px,92%);margin:auto;padding:28px 0 70px}a{color:inherit;text-decoration:none}.back{display:inline-block;margin-bottom:28px;color:#ff9b70}.hero{padding:35px 0 20px}.hero h1{font-size:clamp(36px,6vw,64px);line-height:1.05;margin:0 0 12px}.hero p{color:var(--muted);max-width:700px}.tools{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}.tools input{flex:1;min-width:220px;padding:13px 15px;border-radius:10px;border:1px solid var(--line);background:#111419;color:#fff}.count{color:var(--muted);font-size:14px;margin:12px 0 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:20px;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#414854}.tag{color:#ff9b70;text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:1px}.card h2{font-size:20px;line-height:1.3;margin:8px 0}.card p{color:var(--muted);font-size:14px}.btn{display:inline-block;margin-top:10px;padding:10px 14px;border-radius:9px;background:var(--accent);font-weight:800}.error{padding:18px;border:1px solid #51312a;border-radius:12px;color:#ffb7a3;background:#1b1210}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="./">← Desi Vlog India</a>
<section class="hero">
<h1>Desi Vlog India Blogs</h1>
<p>Yogesh Saharan ke vlog topics, local events, desi life aur useful video stories ke saare published blog posts.</p>
</section>
<div class="tools"><input id="search" type="search" placeholder="Blog search karein..." aria-label="Search blogs"></div>
<div id="count" class="count">Blogs load ho rahe hain...</div>
<div id="grid" class="grid"></div>
<div id="error"></div>
</div>
<script>
const OWNER='onlyoutub2-del',REPO='desivlogindia',BRANCH='main';
const grid=document.getElementById('grid'),count=document.getElementById('count'),search=document.getElementById('search'),error=document.getElementById('error');
let posts=[];
function titleFromFile(name){return name.replace(/\.html$/,'').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function render(){const q=search.value.trim().toLowerCase();const filtered=posts.filter(p=>(p.title+' '+p.name).toLowerCase().includes(q));count.textContent=`${filtered.length} blog${filtered.length===1?'':'s'} available`;grid.innerHTML=filtered.map(p=>`<article class="card"><span class="tag">BLOG</span><h2>${p.title}</h2><p>Desi Vlog India ki video story aur is topic se judi useful information.</p><a class="btn" href="blogs/${encodeURIComponent(p.name)}">Read Blog →</a></article>`).join('')||'<p class="count">Koi blog nahi mila.</p>'}
async function load(){try{const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/blogs?ref=${BRANCH}`);if(!r.ok)throw new Error('GitHub API unavailable');const data=await r.json();posts=data.filter(x=>x.type==='file'&&x.name.toLowerCase().endsWith('.html')).map(x=>({name:x.name,title:titleFromFile(x.name)})).sort((a,b)=>b.name.localeCompare(a.name));render()}catch(e){error.innerHTML='<div class="error">Blogs list load nahi ho paayi. Kuch der baad refresh karke dekhein.</div>';count.textContent=''}}
search.addEventListener('input',render);load();
</script>
</body>
</html>
